# Airflow 3 с KubernetesExecutor: каждая задача — отдельный под, Celery и Redis не нужны. Метаданные в managed PostgreSQL
executor: KubernetesExecutor
# Образ из зеркала в GHCR: из Docker Hub гигабайтный образ Airflow в VK Cloud не скачивается
defaultAirflowRepository: ghcr.io/alexxkn/credit-scoring-mlops/mirror/apache/airflow
nodeSelector:
  node-role.credit-scoring/pool: system
data:
  metadataSecretName: airflow-metadata
# Миграция БД и создание пользователя — обычные Job, а не helm-хуки: с --wait хук ждёт поды, а поды ждут миграцию
migrateDatabaseJob:
  useHelmHooks: false
createUserJob:
  useHelmHooks: false
postgresql:
  enabled: false
redis:
  enabled: false
statsd:
  enabled: false
triggerer:
  persistence:
    enabled: false
workers:
  persistence:
    enabled: false
dags:
  gitSync:
    enabled: true
    repo: https://github.com/alexxkn/credit-scoring-mlops.git
    branch: main
    subPath: airflow/dags
    period: 60s
env:
  - name: AIRFLOW_VAR_TRAINER_IMAGE
    value: ghcr.io/alexxkn/credit-scoring-mlops/trainer:latest
  - name: AIRFLOW_VAR_MODELS_BUCKET
    value: mifirobo-prod-models
  - name: AIRFLOW_VAR_REPORTS_BUCKET
    value: mifirobo-prod-reports
  - name: AIRFLOW_VAR_REDIS_URL
    value: redis://redis.credit-scoring-prod.svc:6379/0
  - name: AIRFLOW_VAR_MLFLOW_TRACKING_URI
    value: http://mlflow.mlops.svc:5000
  - name: AIRFLOW_VAR_PROD_NAMESPACE
    value: credit-scoring-prod
  - name: S3_ENDPOINT_URL
    value: https://hb.ru-msk.vkcloud-storage.ru
  # Логи задач пишутся в S3: под воркера KubernetesExecutor удаляется после задачи, и без этого лог в интерфейсе пропадает.
  # Ключи берутся из переменных AWS_* секрета mlops-s3
  - name: AIRFLOW__LOGGING__REMOTE_LOGGING
    value: "True"
  - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
    value: s3://mifirobo-prod-reports/airflow-logs
  - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
    value: s3_logs
  - name: AIRFLOW_CONN_S3_LOGS
    value: '{"conn_type": "aws", "extra": {"endpoint_url": "https://hb.ru-msk.vkcloud-storage.ru", "region_name": "ru-msk"}}'
extraEnvFrom: |
  - secretRef:
      name: mlops-s3
