name: deploy-production

# После staging: ручное подтверждение в окружении production, canary через Flagger, затем проверка мониторинга
on:
  workflow_run:
    workflows: [deploy-staging]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег образов (короткий sha коммита)
        required: true

concurrency:
  group: deploy-production

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "tag=${tag:-${sha::7}}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@v5

      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Canary deploy
        env:
          APP_S3_ACCESS_KEY: ${{ secrets.APP_S3_ACCESS_KEY }}
          APP_S3_SECRET_KEY: ${{ secrets.APP_S3_SECRET_KEY }}
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
        run: ./scripts/deploy.sh production "${{ steps.tag.outputs.tag }}"

  monitor:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5

      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Smoke test
        run: |
          ./scripts/smoke_test.sh "http://api.${{ vars.INGRESS_HOST }}"
          ./scripts/smoke_test.sh "http://app.${{ vars.INGRESS_HOST }}/api"

      # Через 5 минут после выкатки в Prometheus не должно быть критических алертов по production
      - name: Prometheus alerts
        run: |
          sleep 300
          ./scripts/check_alerts.sh credit-scoring-prod
