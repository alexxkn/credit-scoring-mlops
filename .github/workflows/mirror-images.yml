name: mirror-images

# Docker Hub из VK Cloud отдаёт большие образы очень медленно, поэтому сторонние образы копируются в GHCR
# и кластер скачивает их оттуда. Копируется индекс со всеми архитектурами, без пересборки
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/mirror-images.yml]

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - apache/airflow:3.2.2
          - grafana/alloy:v1.22.0
          - grafana/grafana:13.3.1-distroless
          - grafana/loki:3.6.11
          - library/redis:8-alpine
          - nginxinc/nginx-unprivileged:1.29-alpine
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy to GHCR
        run: |
          target="ghcr.io/${{ github.repository }}/mirror/${{ matrix.image }}"
          target="${target/\/library\//\/}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "${target}" "docker.io/${{ matrix.image }}"
          echo "${target}"
