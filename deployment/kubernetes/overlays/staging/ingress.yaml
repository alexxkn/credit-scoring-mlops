# Kubernetes Ingress для staging: контроллер — istio-ingressgateway (ingressClassName istio)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credit-scoring
spec:
  ingressClassName: istio
  rules:
    - host: staging.INGRESS_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-frontend
                port:
                  number: 80
