# Не входит в kustomization: секрет создаёт CI из GitHub Secrets (kubectl create secret generic credit-scoring-secrets ...)
apiVersion: v1
kind: Secret
metadata:
  name: credit-scoring-secrets
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "<ключ S3-аккаунта workloads из terraform output s3_access_key>"
  AWS_SECRET_ACCESS_KEY: "<terraform output s3_secret_key>"
