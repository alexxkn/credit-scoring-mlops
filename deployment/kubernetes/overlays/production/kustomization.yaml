apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: credit-scoring-prod
resources:
  - ../../base
  - canary.yaml
  - frontend-virtualservice.yaml
  - ab-test.yaml
configMapGenerator:
  - name: credit-scoring-config
    behavior: merge
    literals:
      - MODEL_VERSION=nn-v1
images:
  - name: ghcr.io/alexxkn/credit-scoring-mlops/backend
    newTag: latest
  - name: ghcr.io/alexxkn/credit-scoring-mlops/frontend
    newTag: latest
  - name: ghcr.io/alexxkn/credit-scoring-mlops/drift
    newTag: latest
