# Каждый час: Evidently сравнивает журнал предсказаний с обучающей выборкой, метрики уходят в Pushgateway, отчёт в S3
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-monitor
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: drift-monitor
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            node-role.credit-scoring/pool: app
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: drift
              image: ghcr.io/alexxkn/credit-scoring-mlops/drift:latest
              envFrom:
                - configMapRef:
                    name: credit-scoring-config
                - secretRef:
                    name: credit-scoring-secrets
              env:
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway-prometheus-pushgateway.monitoring.svc:9091
                - name: REPORTS_BUCKET
                  value: mifirobo-prod-reports
                - name: DRIFT_WINDOW
                  value: "5000"
              resources:
                requests: {cpu: 200m, memory: 512Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
