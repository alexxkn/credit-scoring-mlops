# Метрики для canary-анализа Flagger. Поды canary называются credit-scoring-api-<hash>, primary — credit-scoring-api-primary-<hash>
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: api-error-rate
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.monitoring:9090
  query: |
    100 * sum(rate(credit_api_requests_total{namespace="{{ namespace }}", pod!~"{{ target }}-primary-.*", status=~"5.."}[{{ interval }}]))
      / sum(rate(credit_api_requests_total{namespace="{{ namespace }}", pod!~"{{ target }}-primary-.*"}[{{ interval }}]))
---
# Доля прогнозов дефолта у новой версии: сломанная модель, которая всем отвечает 0 или 1, не проходит анализ даже без ошибок HTTP
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: default-rate
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.monitoring:9090
  query: |
    sum(rate(credit_predictions_total{namespace="{{ namespace }}", pod!~"{{ target }}-primary-.*", prediction="1"}[{{ interval }}]))
      / sum(rate(credit_predictions_total{namespace="{{ namespace }}", pod!~"{{ target }}-primary-.*"}[{{ interval }}]))
